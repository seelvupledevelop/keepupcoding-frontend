server {
    listen 8088;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the shell (hash routing + session states)
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
    }

    location /js/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
    }

    location /css/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
    }

    location /img/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
    }

    location /locales/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
    }

    # Hash-router SPA: everything falls back to the shell
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
